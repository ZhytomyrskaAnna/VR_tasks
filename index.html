<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Практична робота №4: Власні компоненти</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <!-- ПІДКЛЮЧАЄМО НАШ ФАЙЛ З КОМПОНЕНТАМИ -->
    <script src="components.js"></script>
  </head>
  <body>
    <a-scene>
      <a-entity camera look-controls wasd-controls position="0 1.6 0">
        <a-cursor></a-cursor>
      </a-entity>
      <!-- Застосовуємо наш новий компонент до куба. Він буде обертатись зі швидкістю за замовчуванням (1) -->
      <a-box position="-2 1.6 -3.5" color="#4CC3D9" self-rotation-with-axis="speed : 10" toggle-visibility-on-click></a-box>

      <!-- Застосовуємо компонент до сфери і передаємо власну швидкість -->
      <a-sphere position="0 1.6 -3.5" color="#EF2D5E" self-rotation-with-axis="speed: -30 axis: 0 1 0"></a-sphere>

      <!-- Застосовуємо компонент до додекаедра з іншою швидкістю -->
      <a-dodecahedron position="2 1.6 -3.5" color="#FFC65D" self-rotation-with-axis="speed: -20 axis: 1 0 0 " look-at-camera ></a-dodecahedron>

      <a-plane position="0 0 -4" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      <a-camera ></a-camera>
    </a-scene>
  </body>
</html>
