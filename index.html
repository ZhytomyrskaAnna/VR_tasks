<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Практична робота №3: Інтерактивність</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>

  </head>
  <body>
    <a-scene>
      <a-camera>
        <a-cursor 
        id="cursor"
        color="#00FFAA"
        scale="0.5 0.5 0.5"
        opacity="1"
        fuse="true"
        fuse-timeout="500"
        animation__hover="property: scale; to: 1 1 1; startEvents: mouseenter; dur: 300"
        animation__hoverOut="property: scale; to: 0.5 0.5 0.5; startEvents: mouseleave; dur: 300"
        animation__fade="property: opacity; to: 0.5; startEvents: mouseenter; dur: 300"
        animation__fadeOut="property: opacity; to: 1; startEvents: mouseleave; dur: 300"
      ></a-cursor>
      </a-camera>
      <a-box id="triggerBox" position="1 1.5 -4" color="#4CC3D9"
             
             animation__enter="property: scale; to: 1.2 1.2 1.2; startEvents: mouseenter; dur: 300"
             
             animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 300"
             
             animation__click="property: scale; to: 1.2 1.2 1.2; startEvents: click; dur: 200">
      </a-box>

      <a-box id="targetBox" position="-1 1.5 -4" color="#4CC3D9"
            animation__changeColor="property: color; to: #FFC65D; startEvents: changeColor; dur: 500"
            animation__spin="property: rotation; to: 0 360 0; startEvents: changeColor; dur: 1000"
      ></a-box>

      <a-text 
  id="infoText" 
  value="cube" 
  position="-1 3 -4" 
  visible="true" 
  opacity="0"
  color="#222" 
  width="4" 
  font="mozillavr"
  animation__fadeIn="property: opacity; to: 1; startEvents: showText; dur: 300"
  animation__fadeOut="property: opacity; to: 0; startEvents: hideText; dur: 300">
</a-text>



      <a-plane position="0 0 -4" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>

    <script>
        const triggerBox=document.querySelector("#triggerBox");
        const targetBox=document.querySelector("#targetBox");
        const infoText = document.querySelector("#infoText");

        triggerBox.addEventListener('click',()=>{
            targetBox.emit('changeColor');
        });
        targetBox.addEventListener('mouseenter', () => {
            infoText.emit('showText');
        });

        targetBox.addEventListener('mouseleave', () => {
            infoText.emit('hideText');
        });

    </script>
  </body>
</html>
