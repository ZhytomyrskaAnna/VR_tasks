<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Практична робота №5: Асети та текстури</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script>
      // Створюємо простий компонент для відтворення відео по кліку
      AFRAME.registerComponent('play-on-click', {
        init: function () {
          this.el.addEventListener('click', () => {
            // 'this.el' - це елемент, до якого прикріплений компонент (наш відеоекран)
            // Отримуємо ID відео з атрибута src
            var videoEl = document.querySelector(this.el.getAttribute('src'));
            if (videoEl.paused) {
              videoEl.play();
            } else {

            }
          });
        }
      });
      AFRAME.registerComponent('play-button', {
      init: function () {
      this.el.addEventListener('click', () => {
        console.log('Play button clicked');
        const video = document.querySelector('#worldVideo');
        video.play();
      });
    }
  });

  // Компонент для паузи відео
      AFRAME.registerComponent('pause-button', {
      init: function () {
      this.el.addEventListener('click', () => {
        console.log('Play button clicked');
        const video = document.querySelector('#worldVideo');
        video.pause();
      });
    }
  });

  AFRAME.registerComponent('portal-switch', {
    init: function () {
      this.el.addEventListener('mouseenter', () => {
        const sky = document.querySelector('a-sky');
        sky.setAttribute('src', '#woodNormal'); // змінюємо фон
      });
    }
  });
    </script>
  </head>
  <body>
    <a-scene>
      <!-- 1. Система управління асетами. Всі ресурси оголошуються тут -->
      <a-assets>
        <img id="woodTexture" src="assets/wood.jpg">
        <img id="panorama" src="assets/pano.jpg">
        <img id="woodNormal" src="assets/wood_normal_map.jpg">
        <video id="worldVideo" autoplay loop="true" src="assets/video.mp4"></video>
      </a-assets>

      <!-- Додаємо камеру та курсор для інтерактивності -->
      <a-camera>
        <a-cursor></a-cursor>
      </a-camera>

      <!-- 2. Створюємо "дерев'яний" ящик. -->
      <!-- В атрибут 'src' ми передаємо ID текстури з <a-assets> -->
      <a-box position="-1 1 -3" rotation="20 45 0" material="src: #woodTexture; roughness: 0.8; metalness: 0.1; normalMap: #woodNormal"></a-box>
      <!-- Кнопка "Play" -->
      <a-box position="0.5 0.5 -3.5" depth="0.2" height="0.2" width="0.2" color="green" play-button></a-box>

      <!-- Кнопка "Pause" -->
      <a-box position="1 0.5 -3.5" depth="0.2" height="0.2" width="0.2" color="red" pause-button></a-box>

      <!-- 3. Створюємо "відеоекран" -->
      <!-- В 'src' передаємо ID відео. Додаємо наш компонент 'play-on-click' -->
      <a-plane position="1 1.5 -4" width="2" height="1.125" src="#worldVideo" play-on-click></a-plane>

      <!-- 4. Використовуємо 360° фото як фон -->
      <!-- Замість color="", ми використовуємо src="" з ID нашого панорамного фото -->
      <a-sky src="#panorama"></a-sky>
      <a-ring position="0 4 -3" radius-inner="0.3" radius-outer="0.5" color="blue" portal-switch></a-ring>

    </a-scene>
  </body>
</html>
