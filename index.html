<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Практична робота №5: Асети та текстури</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script>
      // Створюємо простий компонент для відтворення відео по кліку
      AFRAME.registerComponent('play-on-click', {
        init: function () {
          this.el.addEventListener('click', () => {
            // 'this.el' - це елемент, до якого прикріплений компонент (наш відеоекран)
            // Отримуємо ID відео з атрибута src
            var videoEl = document.querySelector(this.el.getAttribute('src'));
            if (videoEl.paused) {
              videoEl.play();
            } else {
              videoEl.pause();
            }
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene>
      <!-- 1. Система управління асетами. Всі ресурси оголошуються тут -->
      <a-assets>
        <img id="woodTexture" src="assets/wood.jpg">
        <img id="panorama" src="assets/pano.jpg">
        <video id="worldVideo" autoplay loop="true" src="assets/video.mp4"></video>
      </a-assets>

      <!-- Додаємо камеру та курсор для інтерактивності -->
      <a-camera>
        <a-cursor></a-cursor>
      </a-camera>

      <!-- 2. Створюємо "дерев'яний" ящик. -->
      <!-- В атрибут 'src' ми передаємо ID текстури з <a-assets> -->
      <a-box position="-1 1 -3" rotation="20 45 0" src="#woodTexture"></a-box>

      <!-- 3. Створюємо "відеоекран" -->
      <!-- В 'src' передаємо ID відео. Додаємо наш компонент 'play-on-click' -->
      <a-plane position="1 1.5 -4" width="2" height="1.125" src="#worldVideo" play-on-click></a-plane>

      <!-- 4. Використовуємо 360° фото як фон -->
      <!-- Замість color="", ми використовуємо src="" з ID нашого панорамного фото -->
      <a-sky src="#panorama"></a-sky>

    </a-scene>
  </body>
</html>
