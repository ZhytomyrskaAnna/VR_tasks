<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Інтерактивна 3D-модель</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.1.0/dist/aframe-extras.min.js"></script>
    <script>
      // Компонент для керування анімаціями без конфліктів
      AFRAME.registerComponent('jump-and-resume', {
          init: function () {
              const el = this.el;
              const originalPosition = el.getAttribute('position');

              el.addEventListener('click', function () {
                  // Тимчасово призупиняємо основну анімацію
                  const mixer = el.components['animation-mixer'];
                  if (mixer) mixer.pause();

                  // Запускаємо анімацію стрибка
                  el.setAttribute('animation', {
                      property: 'position',
                      to: `${originalPosition.x} ${originalPosition.y + 0.5} ${originalPosition.z}`,
                      dur: 400,
                      dir: 'alternate',
                      loop: 1,
                      // Коли анімація стрибка закінчиться...
                      endEvents: 'animationcomplete'
                  });
              });

              // Слухаємо подію завершення анімації та відновлюємо основну
              el.addEventListener('animationcomplete', function () {
                  const mixer = el.components['animation-mixer'];
                  if (mixer) mixer.play();
              });
          }
      });
  </script>
</head>
<body>
    <a-scene shadow="type: pcfsoft; castShadow: true;">
        <a-assets>
            <a-asset-item id="dragoniteModel" src="assets/dragonite_official.glb"></a-asset-item>
        </a-assets>

        <a-light type="directional" 
        position="-5 5 -5" 
        intensity="1.5" 
        castShadow="true"
        shadow-mapSize="1024 1024"
        shadow-camera-near="0.5"
        shadow-camera-far="20"
        shadow-camera-left="-5"
        shadow-camera-right="5"
        shadow-camera-bottom="-5"
        shadow-camera-top="5"></a-light>
        <a-light type="ambient" color="#888" ></a-light>

        <a-gltf-model src="#dragoniteModel"
            position="0 0 -5"
            scale="2 2 2"
            animation-mixer="clip: pm0149_00_00_00300_roar01; loop: repeat;"
            shadow="cast: true"
            jump-and-resume></a-gltf-model>

        <a-plane 
            position="0 0 -5" 
            rotation="-90 0 0" 
            width="4" 
            height="4" 
            color="#7BC8A4" 
            shadow="receive: true"
        ></a-plane>

        <a-sky color="#ECECEC"></a-sky>
        <a-entity camera position="0 1.6 0"></a-entity>
        <a-camera>
          <a-cursor></a-cursor>
        </a-camera>
    </a-scene>
</body>
</html>
