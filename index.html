<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Практична робота №4: Власні компоненти</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <!-- ПІДКЛЮЧАЄМО НАШ ФАЙЛ З КОМПОНЕНТАМИ -->
    <script src="components.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Застосовуємо наш новий компонент до куба. Він буде обертатись зі швидкістю за замовчуванням (1) -->
      <a-box position="-2 1.6 -3.5" color="#4CC3D9" self-rotation></a-box>

      <!-- Застосовуємо компонент до сфери і передаємо власну швидкість -->
      <a-sphere position="0 1.6 -3.5" color="#EF2D5E" self-rotation="speed: 0.5"></a-sphere>

      <!-- Застосовуємо компонент до додекаедра з іншою швидкістю -->
      <a-dodecahedron position="2 1.6 -3.5" color="#FFC65D" self-rotation="speed: -2"></a-dodecahedron>

      <a-plane position="0 0 -4" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
